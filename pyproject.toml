[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mttr-a"
version = "0.1.0"
description = "MTTR-A cognitive reliability benchmark for multi-agent systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "typing-extensions>=4.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Install one or more cloud extras depending on your provider:
#   pip install -e ".[bedrock]"
#   pip install -e ".[azure]"
#   pip install -e ".[vertex]"
#   pip install -e ".[all]"
bedrock = [
    "langchain-aws>=0.2",
    "boto3>=1.34",
]
azure = [
    "langchain-openai>=0.2",
    "azure-monitor-opentelemetry>=1.0",
]
vertex = [
    "langchain-google-vertexai>=1.0",
    "google-cloud-logging>=3.0",
]
all = [
    "mttr-a[bedrock]",
    "mttr-a[azure]",
    "mttr-a[vertex]",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "python-dotenv>=1.0",
]
notebook = [
    "notebook>=7",
    "ipykernel>=6",
    "matplotlib>=3.8",
    "pandas>=2.0",
]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    "sentence-transformers>=3.0",
]

[project.scripts]
# After pip install -e . you can run: mttr-a
mttr-a = "mttr_a.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mttr_a*"]

[tool.setuptools.py-modules]
# Include the single-file simulation module alongside the package
mttr_a_simulation = "mttr_a_simulation"

[tool.pytest.ini_options]
markers = [
    "live: requires real cloud credentials (skipped in CI by default)",
    "bedrock: requires AWS Bedrock credentials",
    "azure: requires Azure OpenAI credentials",
    "vertex: requires GCP Vertex AI credentials",
]
addopts = "--tb=short"

[tool.coverage.run]
source = ["mttr_a", "mttr_a_simulation"]
omit = ["*/test_*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise ImportError",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
